plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Reads android/app/google-services.json at build time. No manual
    // `dependencies { implementation("com.google.firebase:...") }` block
    // needed here — unlike a plain native Android app, firebase_core/
    // firebase_messaging (declared in pubspec.yaml) already pull in the
    // correct native Firebase SDK versions themselves via the Flutter
    // Gradle plugin.
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.citycalls.customer"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.citycalls.customer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signed with the real upload key when android/key.properties
            // exists (see key.properties.example). Without it the build falls
            // back to the debug key so `flutter run --release` still works on
            // a dev machine — such an APK can NOT be uploaded to the Play Store.
            signingConfig = keystoreProperties['storeFile'] ?
                signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
